# Blueprint de Render. En Render: New > Blueprint > selecciona este repositorio.
# Las imágenes vienen de GHCR (ghcr.io/yayr10/...), publicadas por el workflow CI/CD.
envVarGroups:
  - name: coworkspace-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true

databases:
  - name: coworkspace-db
    plan: free
    databaseName: coworkspace
    user: coworkspace

services:
  - type: keyvalue
    name: coworkspace-redis
    plan: free
    ipAllowList: []            # solo red privada de Render
    maxmemoryPolicy: noeviction

  - type: web
    name: coworkspace-membership
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-membership-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: membership-service
      - key: DB_SCHEMA
        value: membership
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: coworkspace-space
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-space-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: space-service
      - key: DB_SCHEMA
        value: space
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }

  - type: web
    name: coworkspace-booking
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-booking-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: booking-service
      - key: DB_SCHEMA
        value: booking
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }
      - key: SPACE_SERVICE_URL
        value: https://coworkspace-space.onrender.com
      - key: SPACE_TIMEOUT_MS
        value: "60000"
      - key: SAGA_TIMEOUT_MINUTES     # tiempo para pagar en la pasarela antes de liberar el horario
        value: "20"

  - type: web
    name: coworkspace-billing
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-billing-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: billing-service
      - key: DB_SCHEMA
        value: billing
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }
      - key: EXTRA_CHARGE_APPROVAL_LIMIT
        value: "200000"
      # Pasarela de pagos Wompi (sandbox). Sin estas llaves se usa la pasarela simulada.
      - key: WOMPI_PUBLIC_KEY         # pub_test_...
        sync: false
      - key: WOMPI_INTEGRITY_SECRET   # test_integrity_...
        sync: false
      - key: WOMPI_EVENTS_SECRET      # test_events_...
        sync: false
      - key: PAYMENT_REDIRECT_URL
        value: https://coworkspace-web.onrender.com/pago

  # Quinto microservicio: escucha eventos (Redis Streams) y envía correos.
  # Sin BREVO_API_KEY funciona en modo demostración (guarda los correos sin enviarlos).
  - type: web
    name: coworkspace-notification
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-notification-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: notification-service
      - key: DB_SCHEMA
        value: notification
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }
      - key: MEMBERSHIP_SERVICE_URL
        value: https://coworkspace-membership.onrender.com
      - key: SPACE_SERVICE_URL
        value: https://coworkspace-space.onrender.com
      - key: APP_URL
        value: https://coworkspace-web.onrender.com
      - key: MAIL_FROM_NAME
        value: CoworkSpace
      - key: BREVO_API_KEY            # opcional: clave de API de Brevo (brevo.com)
        sync: false
      - key: MAIL_FROM                # opcional: correo remitente verificado en Brevo
        sync: false

  # Control de acceso físico: credenciales QR/NFC y validación en la puerta de cada sede.
  - type: web
    name: coworkspace-access
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-access-control-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: access-control-service
      - key: DB_SCHEMA
        value: access
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }
      - key: MEMBERSHIP_SERVICE_URL
        value: https://coworkspace-membership.onrender.com
      - key: ACCESS_QR_TTL_SECONDS
        value: "120"

  # Comunidad: directorio de miembros, eventos de networking y mensajería interna.
  - type: web
    name: coworkspace-community
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-community-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: community-service
      - key: DB_SCHEMA
        value: community
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }
      - key: MEMBERSHIP_SERVICE_URL
        value: https://coworkspace-membership.onrender.com

  # Analítica: ETL periódico (solo lectura) sobre las bases de los demás servicios.
  - type: web
    name: coworkspace-analytics
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-analytics-service:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: SERVICE_NAME
        value: analytics-service
      - key: DB_SCHEMA
        value: analytics
      - key: DATABASE_URL
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: coworkspace-redis, property: connectionString }
      - key: SOURCE_DATABASE_URL      # en producción: la URL de la réplica de lectura
        fromDatabase: { name: coworkspace-db, property: connectionString }
      - key: ANALYTICS_TZ
        value: America/Bogota

  - type: web
    name: coworkspace-gateway
    runtime: image
    image:
      url: ghcr.io/yayr10/coworkspace-api-gateway:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: coworkspace-shared
      - key: MEMBERSHIP_SERVICE_URL
        value: https://coworkspace-membership.onrender.com
      - key: SPACE_SERVICE_URL
        value: https://coworkspace-space.onrender.com
      - key: BOOKING_SERVICE_URL
        value: https://coworkspace-booking.onrender.com
      - key: BILLING_SERVICE_URL
        value: https://coworkspace-billing.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://coworkspace-notification.onrender.com
      - key: ACCESS_SERVICE_URL
        value: https://coworkspace-access.onrender.com
      - key: COMMUNITY_SERVICE_URL
        value: https://coworkspace-community.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://coworkspace-analytics.onrender.com
      - key: CORS_ORIGIN              # URL del frontend en Vercel
        sync: false

  # ---------- Frontend (sitio estático, gratis y no se duerme) ----------
  - type: web
    name: coworkspace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: /
    # El sitio reenvía la API al gateway desde su propio dominio:
    # los bloqueadores de anuncios no cortan las llamadas y no hace falta CORS.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://coworkspace-gateway.onrender.com/api/*
      - type: rewrite
        source: /health/*
        destination: https://coworkspace-gateway.onrender.com/health/*
      # Página a la que vuelve la pasarela de pagos después de pagar
      - type: rewrite
        source: /pago
        destination: /index.html

