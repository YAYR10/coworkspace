# Levanta los 9 servicios con docker compose y prueba que funcionen JUNTOS:
# prueba de carga k6 del Booking Service y prueba de punta a punta de los servicios nuevos.
# (Lint, pruebas unitarias, imagen y despliegue de cada servicio: workflows svc-*.yml,
#  que invocan el pipeline reutilizable microservicio.yml.)
name: Integración del sistema completo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Pruebas de integración + carga (k6) del Booking Service con todo el stack levantado
  load-test:
    name: Integración y carga k6
    runs-on: ubuntu-latest
    env:
      RATE_LIMIT_PER_MINUTE: 1000000
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el stack
        run: docker compose up -d --build
      - name: Esperar a que los servicios estén listos
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/health/services | grep -qv '"down"'; then
              curl -s http://localhost:3000/health/services && exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Ejecutar k6
        run: |
          docker run --rm --network host -v "$PWD/load-tests:/scripts" grafana/k6:0.54.0 \
            run -e BASE_URL=http://localhost:3000 /scripts/booking-peak.js
      - name: Prueba de punta a punta de Access Control, Community, Analytics y pagos
        run: ./load-tests/smoke-new-services.sh
      - name: Logs si falla
        if: failure()
        run: docker compose logs --tail=200
      - name: Apagar
        if: always()
        run: docker compose down -v
