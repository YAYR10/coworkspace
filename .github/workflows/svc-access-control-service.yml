# Llama al pipeline reutilizable con los datos de este microservicio.
name: access-control-service

on:
  push:
    branches: [main]
    paths:
      - 'services/access-control-service/**'
      - '.github/workflows/microservicio.yml'
      - '.github/workflows/svc-access-control-service.yml'
  pull_request:
    paths:
      - 'services/access-control-service/**'
      - '.github/workflows/microservicio.yml'
      - '.github/workflows/svc-access-control-service.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/microservicio.yml
    permissions:
      contents: write
      packages: write
    with:
      service-name: access-control-service
      working-directory: services/access-control-service
      notify-repo: ${{ github.repository }}
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_ACCESS }}
