# CI del frontend: verifica tipos y que compile cuando cambia algo en frontend/.
# El despliegue (CD) lo hace Render solo: el sitio estático se reconstruye en cada push a main.
name: Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**']
  workflow_dispatch:

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://coworkspace-gateway.onrender.com
