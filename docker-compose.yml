# Entorno local completo: docker compose up --build
# Observabilidad opcional: docker compose --profile observability up --build
x-common-env: &common-env
  REDIS_URL: redis://redis:6379
  DATABASE_URL: postgresql://cowork:cowork@postgres:5432/coworkspace
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}

x-depends: &depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cowork
      POSTGRES_PASSWORD: cowork
      POSTGRES_DB: coworkspace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowork -d coworkspace"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  membership-service:
    build: ./services/membership-service
    environment:
      <<: *common-env
      PORT: 3001
      SERVICE_NAME: membership-service
      DB_SCHEMA: membership
      BILLING_SERVICE_URL: http://billing-service:3004
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-cambia-esto}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@coworkspace.co}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
    depends_on: *depends

  space-service:
    build: ./services/space-service
    environment:
      <<: *common-env
      PORT: 3002
      SERVICE_NAME: space-service
      DB_SCHEMA: space
    depends_on: *depends

  booking-service:
    build: ./services/booking-service
    environment:
      <<: *common-env
      PORT: 3003
      SERVICE_NAME: booking-service
      DB_SCHEMA: booking
      SPACE_SERVICE_URL: http://space-service:3002
    depends_on: *depends

  billing-service:
    build: ./services/billing-service
    environment:
      <<: *common-env
      PORT: 3004
      SERVICE_NAME: billing-service
      DB_SCHEMA: billing
      MEMBERSHIP_SERVICE_URL: http://membership-service:3001
      EXTRA_CHARGE_APPROVAL_LIMIT: 200000
      # Opcional: llaves sandbox de Wompi (sin ellas se usa la pasarela simulada)
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      PAYMENT_REDIRECT_URL: http://localhost:5173/pago
    depends_on: *depends

  notification-service:
    build: ./services/notification-service
    environment:
      <<: *common-env
      PORT: 3005
      SERVICE_NAME: notification-service
      DB_SCHEMA: notification
      MEMBERSHIP_SERVICE_URL: http://membership-service:3001
      SPACE_SERVICE_URL: http://space-service:3002
      # Opcional: sin estas variables los correos se guardan sin enviarse (modo demostración)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: http://localhost:5173
    depends_on: *depends

  access-control-service:
    build: ./services/access-control-service
    environment:
      <<: *common-env
      PORT: 3006
      SERVICE_NAME: access-control-service
      DB_SCHEMA: access
      MEMBERSHIP_SERVICE_URL: http://membership-service:3001
      ACCESS_QR_TTL_SECONDS: 120
    depends_on: *depends

  community-service:
    build: ./services/community-service
    environment:
      <<: *common-env
      PORT: 3007
      SERVICE_NAME: community-service
      DB_SCHEMA: community
      MEMBERSHIP_SERVICE_URL: http://membership-service:3001
    depends_on: *depends

  analytics-service:
    build: ./services/analytics-service
    environment:
      <<: *common-env
      PORT: 3008
      SERVICE_NAME: analytics-service
      DB_SCHEMA: analytics
      # Réplica de solo lectura de las bases de los demás servicios (aquí, la misma instancia)
      SOURCE_DATABASE_URL: postgresql://cowork:cowork@postgres:5432/coworkspace
    depends_on: *depends

  api-gateway:
    build: ./services/api-gateway
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-cambia-esto}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      MEMBERSHIP_SERVICE_URL: http://membership-service:3001
      SPACE_SERVICE_URL: http://space-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      BILLING_SERVICE_URL: http://billing-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      ACCESS_SERVICE_URL: http://access-control-service:3006
      COMMUNITY_SERVICE_URL: http://community-service:3007
      ANALYTICS_SERVICE_URL: http://analytics-service:3008
    depends_on: [membership-service, space-service, booking-service, billing-service, notification-service, access-control-service, community-service, analytics-service]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: [./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro]
    ports: ["3100:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
