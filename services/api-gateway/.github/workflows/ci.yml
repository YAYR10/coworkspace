# CI/CD de api-gateway en su propio repositorio: invoca el pipeline reutilizable
# del repositorio YAYR10/coworkspace-pipelines (cambiarlo allá actualiza todos los servicios).
name: api-gateway

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [service-deployed]
  workflow_dispatch:

jobs:
  pipeline:
    uses: YAYR10/coworkspace-pipelines/.github/workflows/microservicio.yml@main
    permissions:
      contents: write
      packages: write
    with:
      service-name: api-gateway
    # Secrets de este repositorio: RENDER_DEPLOY_HOOK y DISPATCH_TOKEN (token con permiso sobre el gateway)
    secrets: inherit
